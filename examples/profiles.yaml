# An INGEST-PLAN using a top-level `profiles:` block — named overlays that are
# deep-merged OVER the base `defaults:` before each job's own merge.
#
#   ujin plan render   examples/profiles.yaml                 # no overlay (baseline)
#   ujin plan render   examples/profiles.yaml --profile fast  # apply the `fast` overlay
#   ujin plan validate examples/profiles.yaml --profile slow  # offline check
#   UJIN_PLAN_PROFILE=slow ujin jobs-serve --plan examples/profiles.yaml
#
# Select a profile with `--profile NAME` or `$UJIN_PLAN_PROFILE` (the flag wins; with
# neither set no overlay is applied and the plan resolves exactly as it would without
# a `profiles:` block). Merge order is: the selected overlay over `defaults:`, then
# that result deep-merged UNDER each job — so a profile key replaces the same key in
# `defaults:`, but a per-job key still wins over the profile. `matrix:`/`for_each:`
# fan-out and the env- / {{ var }}-substitution layers are unchanged by the overlay.
#
# Selecting a name absent from `profiles:` exits non-zero with a clean `ujin: …`
# message listing the available profiles (no traceback).

defaults:
  source:
    kind: http
  schedule:
    mode: poll
    base: 60                 # base cadence: poll every 60 seconds

profiles:
  fast:
    schedule: { base: 5 }    # tighten every non-overriding job's loop to 5s
  slow:
    schedule: { base: 600 }  # back the same jobs off to 10 minutes

jobs:
  # Inherits the base cadence (60s) — or the selected profile's (5s / 600s).
  - id: home
    source:
      config: { url: "https://example.com/" }

  # Pins its own cadence, so it stays at 9s under EVERY profile (per-job wins).
  - id: status
    schedule: { mode: poll, base: 9 }
    source:
      config: { url: "https://example.com/status" }
