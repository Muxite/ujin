# An INGEST-PLAN using a top-level `vars:` block — default values for the
# `{{ var }}` placeholders the file already uses.
#
#   UJIN_INGEST_PLAN=/path/vars-defaults.yaml ujin jobs-serve
#   ujin jobs-serve --plan /path/vars-defaults.yaml
#   ujin plan validate examples/vars-defaults.yaml          # offline check
#   ujin plan render   examples/vars-defaults.yaml --explain # see the resolved jobs
#
# `vars:` supplies a fallback for any `{{ var }}` that nothing else sets, so the file
# stays runnable with zero configuration yet a deploy can override one value from the
# environment without editing the file. Precedence for a `{{ NAME }}` placeholder:
#
#   1. a matrix/for_each per-entry value       (highest)
#   2. the process environment, variable NAME  (overrides the default)
#   3. the file-level `vars: NAME` default      (lowest)
#
# Run as-is and both feeds query `us-east`; set the environment variable `region`
# to `eu-west` (e.g. in the container) and BOTH jobs switch region with no file
# edit. The dollar-brace env-substitution syntax (VAR / VAR:-default) is unrelated
# to `vars:` and still expands first, at file-read time.

vars:
  region: us-east        # fills every {{ region }} the env/matrix leave unset
  rows: 50               # an int stays an int for an exact-placeholder value

defaults:
  source:
    kind: api
    config:
      method: GET
      json_path: items
  transforms:
    - kind: dedupe
      config: { key: id }
  schedule:
    mode: adaptive
    base: 1800

jobs:
  # A matrix job: `slug` comes from each entry while `region` and `rows` fall back
  # to the vars: defaults above (a per-entry `region` would override them).
  - id: "feed-{{ slug }}-{{ region }}"
    matrix:
      - { slug: news }
      - { slug: jobs }
    source:
      config:
        url: "https://feeds.example.com/{{ region }}/{{ slug }}?rows={{ rows }}"
    sinks:
      - kind: sqlite
      - kind: jsonl
        config: { path: "/data/{{ region }}-{{ slug }}.jsonl" }
