# INGEST-PLAN with `tags:` — label jobs for tag-based selection.
#
# Every job may carry an optional `tags:` key — a single string or a list of
# strings — purely as free-form labels. Tags never change how a job runs; they
# only let the id-pattern selectors gain a tag dimension:
#
#   ujin plan render examples/ingest-plan-tags.yaml --tag prod
#   ujin plan validate examples/ingest-plan-tags.yaml --exclude-tag eu
#   ujin plan eject examples/ingest-plan-tags.yaml --out ./out --tag feeds
#   ujin jobs-serve --plan examples/ingest-plan-tags.yaml --tag prod
#
# `--tag`/`--exclude-tag` are repeatable (or comma-separated), use the same
# fnmatch globbing as `--only`/`--exclude`, and compose with them (a job must
# pass every active filter). Selecting by a tag no job carries fails cleanly.
#
# Tags follow the same precedence and fan-out rules as every other job key:
#   * a per-job `tags:` overrides the `defaults:` `tags:` (no concatenation)
#   * a `{{ var }}` inside a tag substitutes per matrix/for_each entry
# This file loads to three jobs: `crossref` (tags: prod, api), `feed-tech`
# (tags: prod, feeds, region-eu), and `feed-science` (tags: prod, feeds,
# region-us). Drop every `tags:` line below and it resolves to the very same
# jobs — tags are strictly additive.

defaults:
  tags: prod                       # deep-merged under every job; a per-job tags: wins
  source:
    kind: api
    config: { method: GET, json_path: items }
  schedule:
    mode: adaptive
    base: 3600

jobs:
  # A plain job overriding the inherited tag with its own two-tag list.
  - id: crossref
    tags: [prod, api]
    source:
      config:
        url: "https://api.crossref.org/works?rows=50"

  # A matrix job: `{{ region }}` substitutes into a tag per entry, so each
  # fanned-out job carries a distinct `region-*` tag alongside the shared ones.
  - id: "feed-{{ slug }}"
    matrix:
      - { slug: tech, region: eu }
      - { slug: science, region: us }
    tags: [prod, feeds, "region-{{ region }}"]
    source:
      config:
        url: "https://feeds.example.com/{{ slug }}?rows=50"
