# A *cross-product matrix* plan pruned with `exclude:` and extended with `include:`.
#
#   UJIN_INGEST_PLAN=/path/matrix-exclude.yaml ujin jobs-serve
#   ujin jobs-serve --plan /path/matrix-exclude.yaml
#   ujin plan validate examples/matrix-exclude.yaml          # offline check
#   ujin plan render   examples/matrix-exclude.yaml --explain # see the 6 jobs
#
# The base fan-out is the cartesian product of `region` (3 values) and `tier`
# (2 values) = 6 combinations. Two optional, strictly additive filters refine it:
#
#   * `exclude:` is a list of PARTIAL variable maps. A combination is dropped when it
#     agrees with an exclude entry on every key that entry specifies. Here it removes
#     the single `{ region: eu-central, tier: pro }` job. A partial entry such as
#     `{ tier: pro }` would instead drop EVERY `*-pro` job; an entry naming a key no
#     combination has (or a value none holds) matches nothing and is a no-op.
#   * `include:` is a list of FULL variable maps appended to the fan-out AFTER
#     exclusion (and not themselves subject to `exclude:`). Here it adds one explicit
#     `{ region: ap-south, tier: canary }` job that the axes do not generate.
#
# Net result: 6 - 1 excluded + 1 included = 6 jobs. A matrix block with neither
# filter resolves byte-for-byte as before. See docs/WORKFLOWS.md ("pruning and
# extending — exclude / include") and docs/INGEST_PLAN.md.

jobs:
  - id: "status-{{ region }}-{{ tier }}"
    matrix:
      region: [us-east, us-west, eu-central]
      tier: [free, pro]
      exclude:
        - { region: eu-central, tier: pro }   # drop this one combination
      include:
        - { region: ap-south, tier: canary }  # append one explicit extra job
    source:
      kind: api
      config:
        url: "https://api.example.com/{{ region }}/status?tier={{ tier }}"
        method: GET
        json_path: services
    transforms:
      - kind: select
        config:
          path: payload
          fields: [id, name, healthy]
    sinks:
      - kind: sqlite          # record change events durably
      - kind: jsonl
        config: { path: "/data/status-{{ region }}-{{ tier }}.jsonl" }
    schedule:
      mode: adaptive
      base: 600
      min: 60
      max: 7200
      jitter: decorrelated
